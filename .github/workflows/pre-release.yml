name: pre-release

# Windows gate + release. Regular CI is ubuntu-only for speed (see test.yml),
# so this workflow asserts the same UTC goldens on Windows, proving PHP's
# bundled tzdata needs no OS tzdata. Run it manually (Actions → pre-release →
# Run workflow) before cutting a release, or let a `v*` tag push trigger it.
#
# On a tag push, `github-release` runs *after* the Windows gate for that same
# tag passes (`needs:`), so a release can never be published ahead of — or
# without — the Windows proof. Packagist picks up the tag automatically once
# the package is submitted (one-time setup on packagist.org); Composer needs
# no build artifact from us.
#
# Actions are pinned to full commit SHAs (with the resolved release in a
# trailing comment): `github-release` holds `contents: write`, so a retargeted
# mutable tag upstream could otherwise run arbitrary code with that token.
# Dependabot refreshes the pins weekly — do not "simplify" them back to tags.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test-windows:
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
        tz: ['UTC']
        include:
          - php: '8.4'
            tz: America/New_York
    runs-on: windows-latest
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: date
          coverage: pcov
      - run: composer install --no-progress
      - run: >-
          php -r 'exit(count(json_decode(file_get_contents("composer.lock"), true)["packages"]) === 0 ? 0 : 1);'
      - run: composer test
      - run: composer bench

  github-release:
    # Only a tag (pushed, or a manual run dispatched on a tag) releases; and
    # only once the Windows gate above passed.
    if: github.ref_type == 'tag'
    needs: test-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # ancestry check below walks history
          persist-credentials: false

      - name: Verify the tag is releasable
        # The tag name is data from the ref namespace, never shell source: it
        # is passed through the environment, never interpolated into the script.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $TAG is not a plain vX.Y.Z version tag."
            exit 1
          fi

          git fetch --quiet --no-tags origin main:refs/remotes/origin/main
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::Could not resolve origin/main to verify the tag's ancestry."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG does not point at a commit on main; refusing to publish."
            exit 1
          fi

          # Exact dated header: literal match on the version, shape check on the
          # date, so a version the CHANGELOG never shipped cannot release.
          if ! grep -F "## [$VERSION] - " CHANGELOG.md | grep -qE '^## \[[^]]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::CHANGELOG.md has no exact '## [$VERSION] - YYYY-MM-DD' header for tag $TAG."
            exit 1
          fi

          # The docs snapshot is generated by the versioning plugin and must be
          # committed before the tag, or the release never reaches the switcher.
          if [ ! -d "docs/user/$TAG" ] || [ ! -f "docs_site/src/content/versions/$TAG.json" ]; then
            echo "::error::Docs snapshot missing for $TAG. Freeze it (see README → Docs) and commit docs/user/$TAG/ plus docs_site/src/content/versions/$TAG.json."
            exit 1
          fi
          if ! grep -qF "\"$TAG\"" docs_site/versions.json; then
            echo "::error::docs_site/versions.json has no $TAG entry; the version switcher would hide this release."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes
