name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/user/**'
      - 'docs_site/**'
      - 'src/**'
      - 'composer.json'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/user/**'
      - 'docs_site/**'
      - 'src/**'
      - 'composer.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs_site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs_site

      - name: Build docs
        run: npm run build
        working-directory: docs_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_site/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
