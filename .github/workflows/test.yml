name: test

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: date
          coverage: none
      - run: composer install --no-progress
      - run: composer lint
      - run: composer cs
      - run: composer stan
      - run: composer audit

  test:
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
        tz: ['UTC']
        include:
          - php: '8.4'
            tz: America/New_York
    runs-on: ubuntu-latest
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: date
          coverage: pcov
      - run: composer install --no-progress
      - run: >-
          php -r 'exit(count(json_decode(file_get_contents("composer.lock"), true)["packages"]) === 0 ? 0 : 1);'
      - run: composer test
      - run: composer bench

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: date
          coverage: pcov
      - run: composer install --no-progress
      - run: composer mutation
