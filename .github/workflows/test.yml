name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
        os: [ubuntu-latest, windows-latest]
        tz: ['UTC', 'America/New_York']
    runs-on: ${{ matrix.os }}
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: date
          coverage: pcov
      - run: composer install --no-progress
      - run: >-
          php -r 'exit(count(json_decode(file_get_contents("composer.lock"), true)["packages"]) === 0 ? 0 : 1);'
      - run: composer lint
      - run: composer cs
      - run: composer stan
      - run: composer test
      - run: composer bench
